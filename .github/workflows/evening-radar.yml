name: Boston PM Radar - Evening Scan

on:
  workflow_dispatch:
  # GitHub connector trigger for explicit on-demand runs. Normal report commits won't retrigger scans.
  push:
    branches: [main]
    paths:
      - '.github/radar-run-request.txt'
  schedule:
    # ~7 PM ET during daylight saving / ~6 PM ET during standard time.
    # GitHub scheduled runs can be delayed.
    - cron: '0 23 * * *'

permissions:
  contents: write

# Prevent simultaneous scans from fighting over generated report commits.
concurrency:
  group: boston-pm-radar-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate code
        run: python -m unittest discover -s tests -v
      - name: Fetch and rank postings
        run: python radar.py
      - name: Upload dashboard and CSV
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: boston-pm-radar-${{ github.run_number }}
          path: |
            out/index.html
            out/jobs.csv
            out/jobs.json
            out/expired_jobs.csv
            out/run_log.json
            out/source_health.csv
            out/employers_with_matches.csv
            out/ats_company_catalog.csv
          retention-days: 30
          if-no-files-found: warn
      - name: Preserve source history and dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar.sqlite3 out/index.html out/jobs.csv out/jobs.json out/expired_jobs.csv out/run_log.json out/source_health.csv out/employers_with_matches.csv out/ats_company_catalog.csv
          if git diff --staged --quiet; then
            echo 'No changes to commit'
          else
            git commit -m "Update evening Boston PM report"
            # A code/config change can land while the scan runs; safely replay
            # the report commit on the latest remote branch before retrying.
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                echo 'Report committed successfully'
                exit 0
              fi
              echo "Push rejected (attempt $attempt); integrating remote changes..."
              git fetch origin main
              if ! git rebase -X theirs origin/main; then
                git rebase --abort || true
                echo '::error::Cannot integrate remote changes. Download report from the Actions artifact.'
                exit 1
              fi
            done
            echo '::error::Cannot push report after 3 attempts. Download the report artifact.'
            exit 1
          fi
